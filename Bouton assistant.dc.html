<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  @keyframes ba-fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ba-panelIn {
    from { opacity: 0; transform: translateY(10px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes ba-breatheDot {
    0%, 100% { box-shadow: 0 0 0 0 rgba(176,87,62,.34); transform: scale(1); }
    50%      { box-shadow: 0 0 0 6px rgba(176,87,62,0); transform: scale(1.12); }
  }
  @keyframes ba-breatheBubble {
    0%, 100% { opacity: .82; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.08); }
  }
  /* Hover intensifie doucement la respiration de l'icône */
  [data-pill]:hover [data-breathe="dot"]    { animation-duration: 1.5s; }
  [data-pill]:hover [data-breathe="bubble"] { animation-duration: 1.5s; }
  [data-pill]:focus-visible {
    outline: 2px solid #B0573E;
    outline-offset: 4px;
  }
  [data-send]:focus-visible, [data-close]:focus-visible {
    outline: 2px solid #B0573E;
    outline-offset: 2px;
  }
  [data-msginput]:focus { outline: none; }
  @media (max-width: 480px) {
    [data-pill] { padding: 13px 18px !important; font-size: 15px !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    [data-anim], [data-breathe] { animation: none !important; }
    [data-motion] { transition: none !important; }
  }
</style>
</helmet>
<div data-screen-label="Aperçu bouton assistant" style="position: relative; min-height: 100vh; width: 100%; background: #F3EFE9; font-family: 'Libre Baskerville', Baskerville, 'Times New Roman', serif; overflow: hidden;">

  <!-- Filigrane discret pour situer le contexte -->
  <div style="position: absolute; top: 40px; left: 44px; color: rgba(22,21,20,.34); font-size: 13px; letter-spacing: .14em; text-transform: uppercase;">Aperçu — assistant</div>

  <!-- Ancre fixe bas-droite -->
  <div style="--accent: {{ accent }}; position: fixed; right: 28px; bottom: 28px; z-index: 50; font-family: 'Libre Baskerville', Baskerville, serif;">

    <!-- ÉTAT FERMÉ : la pill -->
    <sc-if value="{{ closed }}" hint-placeholder-val="{{ true }}">
      <button type="button" data-pill data-anim data-motion onClick="{{ toggle }}"
        aria-label="Ouvrir l'assistant — Une question ?"
        style="display: inline-flex; align-items: center; gap: 11px; border: none; cursor: pointer; background: #161514; color: #F1ECE3; padding: 15px 22px; border-radius: 999px; font-family: inherit; font-size: 16px; letter-spacing: .01em; line-height: 1; box-shadow: 0 1px 2px rgba(22,21,20,.14), 0 6px 18px rgba(22,21,20,.14); transition: transform .32s cubic-bezier(.22,.61,.36,1), box-shadow .32s cubic-bezier(.22,.61,.36,1); animation: ba-fadeSlideUp .66s cubic-bezier(.22,.61,.36,1) .18s both;"
        style-hover="transform: translateY(-2px); box-shadow: 0 2px 4px rgba(22,21,20,.16), 0 12px 30px rgba(22,21,20,.2);">
        <!-- Icône : point qui respire -->
        <sc-if value="{{ isDot }}" hint-placeholder-val="{{ true }}">
          <span data-breathe="dot" style="width: 9px; height: 9px; border-radius: 50%; background: var(--accent, #B0573E); flex: none; animation: ba-breatheDot 3.6s ease-in-out infinite;"></span>
        </sc-if>
        <!-- Icône : bulle de dialogue au trait -->
        <sc-if value="{{ isBubble }}" hint-placeholder-val="{{ true }}">
          <span data-breathe="bubble" style="display: inline-flex; color: var(--accent, #B0573E); flex: none; animation: ba-breatheBubble 3.6s ease-in-out infinite;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.2a2.4 2.4 0 0 1-2.4 2.4H8.2L4 20.8V6a2.4 2.4 0 0 1 2.4-2.4h11.2A2.4 2.4 0 0 1 20 6z"></path></svg>
          </span>
        </sc-if>
        <span>Une question&#8201;?</span>
      </button>
    </sc-if>

    <!-- ÉTAT OUVERT : le panneau -->
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <section data-anim role="dialog" aria-label="Assistant de réservation"
        style="width: min(370px, calc(100vw - 40px)); background: #F8F5F0; border-radius: 20px; overflow: hidden; box-shadow: 0 2px 6px rgba(22,21,20,.12), 0 20px 48px rgba(22,21,20,.22); transform-origin: bottom right; animation: ba-panelIn .34s cubic-bezier(.22,.61,.36,1) both; display: flex; flex-direction: column;">

        <!-- En-tête anthracite -->
        <header style="background: #161514; color: #F1ECE3; padding: 20px 22px 18px;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent, #B0573E); flex: none;"></span>
              <h2 style="margin: 0; font-size: 19px; font-weight: 400; letter-spacing: .01em;">Une question&#8201;?</h2>
            </div>
            <button type="button" data-close data-motion onClick="{{ close }}" aria-label="Fermer"
              style="border: none; background: transparent; color: rgba(241,236,227,.6); cursor: pointer; padding: 2px; margin: -2px -4px 0 0; display: inline-flex; border-radius: 6px; transition: color .2s ease;"
              style-hover="color: #F1ECE3;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <p style="margin: 9px 0 0 18px; font-size: 12.5px; font-style: italic; color: rgba(241,236,227,.6); line-height: 1.4;">La maison vous répond en quelques minutes.</p>
        </header>

        <!-- Fil de conversation -->
        <div data-body ref="{{ bodyRef }}"
          style="flex: 1; min-height: 220px; max-height: min(420px, 52vh); overflow-y: auto; padding: 20px 18px; display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{ messages }}" as="m" hint-placeholder-count="2">
            <sc-if value="{{ m.isBot }}" hint-placeholder-val="{{ true }}">
              <div style="align-self: flex-start; max-width: 82%; background: #FFFFFF; color: #161514; border: 1px solid rgba(22,21,20,.07); border-radius: 15px 15px 15px 4px; padding: 11px 14px; font-size: 14px; line-height: 1.5; box-shadow: 0 1px 2px rgba(22,21,20,.04);">{{ m.text }}</div>
            </sc-if>
            <sc-if value="{{ m.isUser }}" hint-placeholder-val="{{ false }}">
              <div style="align-self: flex-end; max-width: 82%; background: #161514; color: #F1ECE3; border-radius: 15px 15px 4px 15px; padding: 11px 14px; font-size: 14px; line-height: 1.5;">{{ m.text }}</div>
            </sc-if>
          </sc-for>
        </div>

        <!-- Barre de saisie -->
        <footer style="padding: 14px 16px 16px; border-top: 1px solid rgba(22,21,20,.08); display: flex; align-items: center; gap: 10px;">
          <input data-msginput type="text" value="{{ input }}" onInput="{{ onInput }}" onKeyDown="{{ onKey }}"
            placeholder="Écrivez votre message…"
            style="flex: 1; min-width: 0; border: 1px solid rgba(22,21,20,.14); background: #FFFFFF; border-radius: 999px; padding: 11px 16px; font-family: inherit; font-size: 14px; color: #161514;">
          <button type="button" data-send data-motion onClick="{{ send }}" aria-label="Envoyer"
            style="flex: none; width: 42px; height: 42px; border: none; border-radius: 50%; background: var(--accent, #B0573E); color: #F8F5F0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: transform .2s ease, filter .2s ease;"
            style-hover="transform: scale(1.05); filter: brightness(1.06);"
            style-active="transform: scale(.96);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4z"></path></svg>
          </button>
        </footer>
      </section>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:640},&quot;iconStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dot&quot;,&quot;bubble&quot;],&quot;default&quot;:&quot;dot&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Icône&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5A6B5D&quot;,&quot;options&quot;:[&quot;#B0573E&quot;,&quot;#8C6A4E&quot;,&quot;#5A6B5D&quot;,&quot;#161514&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;},&quot;startOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Aperçu&quot;}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      open: !!(props && props.startOpen),
      input: '',
      messages: [
        { id: 1, from: 'bot', text: "Bonjour. Une question sur nos maisons, les disponibilités ou votre séjour\u202f? Nous vous répondons avec plaisir." }
      ]
    };
    this._nid = 2;
    this.bodyRef = React.createRef();
  }

  componentDidUpdate(prevProps, prevState) {
    if (prevState.messages !== this.state.messages && this.bodyRef.current) {
      const el = this.bodyRef.current;
      el.scrollTop = el.scrollHeight;
    }
  }

  toggle = () => this.setState(s => ({ open: !s.open }));
  close = () => this.setState({ open: false });
  onInput = (e) => this.setState({ input: e.target.value });
  onKey = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } };

  send = () => {
    const text = (this.state.input || '').trim();
    if (!text) return;
    const id = this._nid++;
    this.setState(s => ({ input: '', messages: [...s.messages, { id, from: 'user', text }] }));
    setTimeout(() => {
      const rid = this._nid++;
      this.setState(s => ({
        messages: [...s.messages, { id: rid, from: 'bot', text: "Merci pour votre message. Un membre de la maison revient vers vous dans un instant." }]
      }));
    }, 950);
  };

  renderVals() {
    const accent = this.props.accentColor || '#B0573E';
    const iconStyle = this.props.iconStyle || 'dot';
    return {
      open: this.state.open,
      closed: !this.state.open,
      input: this.state.input,
      messages: this.state.messages.map(m => ({ ...m, isUser: m.from === 'user', isBot: m.from === 'bot' })),
      accent,
      isDot: iconStyle === 'dot',
      isBubble: iconStyle === 'bubble',
      toggle: this.toggle,
      close: this.close,
      onInput: this.onInput,
      onKey: this.onKey,
      send: this.send,
      bodyRef: this.bodyRef,
    };
  }
}
</script>
</body>
</html>
